name: 🧪 CI — Tests E2E + Postman / Newman

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
      - "fix/**"
      - "test/**"
      - "refactor/**"
  pull_request:
    branches:
      - main
      - master

# Annule les runs précédents sur la même branche pour économiser les minutes CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  API_URL: "http://localhost:3001"
  # Credentials : valeurs par défaut CI, surchargées par GitHub Secrets si définis
  API_USERNAME: ${{ secrets.API_USERNAME || 'admin' }}
  API_PASSWORD: ${{ secrets.API_PASSWORD || 'changeme' }}
  JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-key-github-actions' }}
  NODE_ENV: test

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — Lint + TypeScript check (rapide, pas besoin de Docker)
  # ───────────────────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: 🔍 Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 ESLint
        run: npm run lint:local -- --max-warnings 0
        continue-on-error: false

      - name: 🔷 TypeScript check (tsc --noEmit)
        run: npx tsc --noEmit
        continue-on-error: false

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — Tests Jest/Supertest e2e (services mockés, pas de Docker)
  # ───────────────────────────────────────────────────────────────────────────
  jest-e2e:
    name: 🧪 Jest E2E (services mockés)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run Jest E2E suites
        run: npm run test:e2e:ci
        env:
          API_USERNAME: ${{ env.API_USERNAME }}
          API_PASSWORD: ${{ env.API_PASSWORD }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          NODE_ENV: test

      - name: 📊 Upload Jest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-e2e-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3 — Tests d'intégration sur API Docker (stack complète)
  # ───────────────────────────────────────────────────────────────────────────
  integration-docker:
    name: 🐳 Integration Tests (Docker stack)
    runs-on: ubuntu-latest
    needs: jest-e2e
    timeout-minutes: 20

    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📦 Install Newman and reporters globally
        run: |
          npm install -g newman newman-reporter-htmlextra
          # openapi-to-postmanv2 : outil CLI pour convertir OpenAPI → Postman collection
          npm install -g openapi-to-postmanv2

      # ── Build et démarrage de la stack CI ──────────────────────────────────
      - name: 🐳 Build Docker image
        run: docker compose -f docker-compose.ci.yml build --no-cache app

      - name: 🚀 Start Docker Compose (CI stack)
        run: |
          docker compose -f docker-compose.ci.yml up -d
          echo "✅ Containers démarrés"
          docker compose -f docker-compose.ci.yml ps
        env:
          # Variables injectées dans les services via docker-compose.ci.yml ${VAR:-default}
          SWAGGER_ENABLED: "true"
          API_USERNAME: ${{ env.API_USERNAME }}
          API_PASSWORD: ${{ env.API_PASSWORD }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      # ── Attendre que l'API soit prête ───────────────────────────────────────
      - name: ⏳ Wait for API to be ready
        run: |
          echo "Attente du healthcheck API sur ${{ env.API_URL }}/health..."
          timeout=120
          elapsed=0
          interval=5
          while true; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.API_URL }}/health" || echo "000")
            if [ "$status" = "200" ]; then
              echo "✅ API prête après ${elapsed}s (HTTP $status)"
              break
            fi
            if [ $elapsed -ge $timeout ]; then
              echo "❌ Timeout: API non disponible après ${timeout}s"
              docker compose -f docker-compose.ci.yml logs app --tail=50
              exit 1
            fi
            echo "  → HTTP $status — attente ${interval}s... (${elapsed}s / ${timeout}s)"
            sleep $interval
            elapsed=$((elapsed + interval))
          done

      # ── Obtenir le token JWT pour les tests Postman ─────────────────────────
      - name: 🔑 Get JWT token for Postman tests
        id: auth
        run: |
          TOKEN=$(curl -s -X POST "${{ env.API_URL }}/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${{ env.API_USERNAME }}\",\"password\":\"${{ env.API_PASSWORD }}\"}" \
            | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "❌ Impossible d'obtenir le JWT"
            exit 1
          fi
          echo "✅ JWT obtenu"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      # ── Générer la collection Postman depuis OpenAPI ──────────────────────────
      - name: 📋 Generate Postman collection from OpenAPI spec
        run: |
          # Récupérer la spec OpenAPI depuis l'API en cours d'exécution
          curl -sf "${{ env.API_URL }}/api-json" -o openapi-spec.json
          echo "✅ OpenAPI spec récupérée"
          jq '.info.title, .info.version' openapi-spec.json

          # Convertir en collection Postman v2.1
          # openapi-to-postmanv2 est installé globalement à l'étape précédente
          openapi-to-postmanv2 \
            -s openapi-spec.json \
            -o postman/generated-collection.json \
            -O folderStrategy=Tags,requestParametersResolution=Example,optimizeParameterHandling=true,includeAuthInfoInExample=true
          echo "✅ Collection Postman générée"
          jq '.info.name, (.item | length)' postman/generated-collection.json

      # ── Injecter le token JWT dans la collection générée ───────────────────
      - name: 🔐 Inject JWT token into Postman collection
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const collection = JSON.parse(fs.readFileSync('postman/generated-collection.json', 'utf8'));

          // Ajouter l'auth Bearer au niveau racine de la collection
          collection.auth = {
            type: 'bearer',
            bearer: [{ key: 'token', value: process.env.JWT_TOKEN, type: 'string' }]
          };

          // Ajouter une variable de collection pour le baseUrl
          if (!collection.variable) collection.variable = [];
          collection.variable.push(
            { key: 'baseUrl', value: process.env.API_URL, type: 'string' },
            { key: 'jwtToken', value: process.env.JWT_TOKEN, type: 'string' }
          );

          fs.writeFileSync('postman/generated-collection.json', JSON.stringify(collection, null, 2));
          console.log('✅ JWT injecté dans la collection Postman');
          EOF
        env:
          JWT_TOKEN: ${{ steps.auth.outputs.token }}
          API_URL: ${{ env.API_URL }}

      # ── Créer le dossier pour les résultats Newman ────────────────────────
      - name: 📁 Create newman-results directory
        run: mkdir -p newman-results

      # ── Créer l'environnement Postman pour Newman ──────────────────────────
      - name: 🌍 Create Postman environment file for Newman
        run: |
          # Utiliser node pour éviter les problèmes d'échappement bash avec le heredoc
          node -e "
            const env = {
              id: 'ci-environment',
              name: 'CI Environment',
              values: [
                { key: 'baseUrl',  value: process.env.API_URL,       enabled: true },
                { key: 'jwtToken', value: process.env.JWT_TOKEN,     enabled: true },
                { key: 'username', value: process.env.API_USERNAME,  enabled: true },
                { key: 'password', value: process.env.API_PASSWORD,  enabled: true }
              ]
            };
            require('fs').writeFileSync('postman/ci-environment.json', JSON.stringify(env, null, 2));
            console.log('✅ Environnement Postman créé');
          "
        env:
          API_URL: ${{ env.API_URL }}
          JWT_TOKEN: ${{ steps.auth.outputs.token }}
          API_USERNAME: ${{ env.API_USERNAME }}
          API_PASSWORD: ${{ env.API_PASSWORD }}

      # ── Exécuter Newman (tests Postman en CLI) ─────────────────────────────
      - name: 🏃 Run Newman (Postman collection tests)
        run: |
          newman run postman/generated-collection.json \
            --environment postman/ci-environment.json \
            --reporters cli,junit,htmlextra \
            --reporter-junit-export newman-results/junit.xml \
            --reporter-htmlextra-export newman-results/report.html \
            --reporter-htmlextra-title "LangChain RAG API — Newman Report" \
            --timeout-request 30000 \
            --delay-request 200 \
            --bail \
            --color on
        # Newman retourne exit code non-zéro si des tests échouent → la step échoue automatiquement

      # ── Rapport Newman complémentaire sur la collection Postman versionnée ─
      - name: 🏃 Run Newman (versioned Postman collection)
        if: success()
        run: |
          COLLECTION="postman/LangChain-RAG-NestJS-API.postman_collection.json"
          if [ -f "$COLLECTION" ]; then
            echo "📋 Exécution de la collection versionnée..."
            newman run "$COLLECTION" \
              --environment postman/ci-environment.json \
              --reporters cli,junit \
              --reporter-junit-export newman-results/junit-versioned.xml \
              --timeout-request 30000 \
              --delay-request 200 \
              --color on \
            || echo "⚠️  Certains tests de la collection versionnée ont échoué (non-bloquant)"
          else
            echo "ℹ️  Collection Postman versionnée absente — skipping"
          fi

      # ── Afficher les logs Docker en cas d'échec ────────────────────────────
      - name: 🪵 Show Docker logs on failure
        if: failure()
        run: |
          echo "=== Logs APP ==="
          docker compose -f docker-compose.ci.yml logs app --tail=100
          echo "=== Logs REDIS ==="
          docker compose -f docker-compose.ci.yml logs redis --tail=20

      # ── Upload des artefacts ───────────────────────────────────────────────
      - name: 📊 Upload Newman HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-results/
          retention-days: 14

      - name: 📋 Upload generated Postman collection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-generated-collection
          path: postman/generated-collection.json
          retention-days: 14

      - name: 📋 Upload OpenAPI spec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi-spec.json
          retention-days: 14

      # ── Publier les résultats JUnit dans GitHub ────────────────────────────
      - name: 📋 Publish Newman JUnit results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "newman-results/junit*.xml"
          check_name: "Newman API Tests"
          fail_on_failure: true

      # ── Arrêter les containers ─────────────────────────────────────────────
      - name: 🛑 Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4 — Audit de sécurité npm
  # ───────────────────────────────────────────────────────────────────────────
  security-audit:
    name: 🔒 Security Audit (npm audit)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔒 npm audit (high + critical only)
        run: npm audit --audit-level=high
        continue-on-error: false

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5 — Summary global (badge de statut)
  # ───────────────────────────────────────────────────────────────────────────
  ci-summary:
    name: ✅ CI Summary
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, jest-e2e, integration-docker, security-audit]
    if: always()
    steps:
      - name: 📋 CI Results Summary
        run: |
          echo "## 🧪 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Lint & TypeScript | ${{ needs.lint-and-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Jest E2E (mockés) | ${{ needs.jest-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Integration Docker | ${{ needs.integration-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security Audit | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Faire échouer si un job critique a échoué
          if [[ "${{ needs.jest-e2e.result }}" == "failure" ]]; then
            echo "❌ Jest E2E tests FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          if [[ "${{ needs.integration-docker.result }}" == "failure" ]]; then
            echo "❌ Integration tests FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ All critical checks passed" >> $GITHUB_STEP_SUMMARY
