services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: rag-nestjs-app-dev
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

      # Swagger Security
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-true}
      - SWAGGER_USERNAME=${SWAGGER_USERNAME:-admin}
      - SWAGGER_PASSWORD=${SWAGGER_PASSWORD:-changeme}

      # CORS Configuration
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:3000}

      # JWT Authentication
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - API_USERNAME=${API_USERNAME:-admin}
      - API_PASSWORD=${API_PASSWORD:-changeme}

      # LLM
      - OLLAMA_BASE_URL=http://ollama:11434
      - GROQ_API_KEY=${GROQ_API_KEY}

      # Vector DB
      - VECTOR_STORE_TYPE=chroma
      - CHROMA_URL=http://chroma:8000
      - QDRANT_URL=http://qdrant:6333

      # Search
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - SEARXNG_URL=http://searxng:8080

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - REDIS_TLS_ENABLED=false

    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - .:/app

    command: npm run start:dev:poll

    depends_on:
      - chroma
      - qdrant
      - ollama
      - redis
      - searxng

    networks:
      - rag-network

  chroma:
    image: chromadb/chroma:latest
    container_name: rag-chroma-dev
    ports:
      - "8001:8000"
    volumes:
      - ./data/vector-db/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - rag-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant-dev
    ports:
      - "6334:6333"
      - "6335:6334"
    volumes:
      - ./data/vector-db/qdrant:/qdrant/storage
    networks:
      - rag-network

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama-dev
    ports:
      - "11435:11434"
    volumes:
      - ./data/cache/ollama:/root/.ollama
      - ./docker/init-scripts:/init-scripts:ro
    networks:
      - rag-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Démarrer Ollama en arrière-plan
        /bin/ollama serve &
        
        # Attendre que le service soit prêt
        echo "Attente du démarrage d'Ollama..."
        sleep 5
        
        # Télécharger les modèles si non présents
        if ! ollama list | grep -q "nomic-embed-text"; then
          echo "Téléchargement de nomic-embed-text..."
          ollama pull nomic-embed-text
        fi
        
        if ! ollama list | grep -q "llama3.2"; then
          echo "Téléchargement de llama3.2..."
          ollama pull llama3.2
        fi
        
        echo "Ollama prêt avec les modèles configurés"
        ollama list
        
        # Garder le container actif
        wait

  redis:
    image: redis:7-alpine
    container_name: rag-redis-dev
    ports:
      - "6380:6379"
    volumes:
      - ./data/cache/redis:/data
    networks:
      - rag-network

  searxng:
    image: searxng/searxng:latest
    container_name: rag-searxng-dev
    ports:
      - "8888:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    networks:
      - rag-network

volumes:
  node_modules:

networks:
  rag-network:
    driver: bridge
