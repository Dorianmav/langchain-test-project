services:
  # Application NestJS principale
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rag-nestjs-app
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      # LLM Configuration
      - OLLAMA_BASE_URL=http://ollama:11434
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Vector Store Configuration
      - VECTOR_STORE_TYPE=chroma
      - CHROMA_URL=http://chroma:8000
      - QDRANT_URL=http://qdrant:6333
      # Search Configuration
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./uploads:/app/uploads
      - node_modules:/app/node_modules
    depends_on:
      - chroma
      - qdrant
      - ollama
      - redis
    networks:
      - rag-network
    restart: unless-stopped
    command: node dist/main.js

  # Ollama - LLM local (Llama, Mistral, etc.)
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - rag-network
    restart: unless-stopped
    # Décommenter si vous avez un GPU NVIDIA
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Ollama Web UI - Interface pour gérer les modèles
  ollama-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: rag-ollama-webui
    ports:
      - "8081:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ollama-webui-data:/app/backend/data
    depends_on:
      - ollama
    networks:
      - rag-network
    restart: unless-stopped

  # ChromaDB - Vector Database
  chroma:
    image: chromadb/chroma:latest
    container_name: rag-chroma
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - rag-network
    restart: unless-stopped

  # Qdrant - Alternative Vector Database (plus performante)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6335:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - rag-network
    restart: unless-stopped

  # Redis - Cache et session management
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - rag-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # PostgreSQL - Base de données relationnelle (optionnel)
  # Utile pour stocker metadata, utilisateurs, historique, etc.
  postgres:
    image: postgres:15-alpine
    container_name: rag-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=raguser
      - POSTGRES_PASSWORD=ragpassword
      - POSTGRES_DB=ragdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - rag-network
    restart: unless-stopped

  # SearXNG - Moteur de recherche auto-hébergé (alternative à Tavily)
  searxng:
    image: searxng/searxng:latest
    container_name: rag-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    networks:
      - rag-network
    restart: unless-stopped

  # Nginx - Reverse proxy (optionnel, pour production)
  nginx:
    image: nginx:alpine
    container_name: rag-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - rag-network
    restart: unless-stopped
    profiles:
      - production

  # Prometheus - Monitoring (optionnel)
  prometheus:
    image: prom/prometheus:latest
    container_name: rag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - rag-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana - Dashboard monitoring (optionnel)
  grafana:
    image: grafana/grafana:latest
    container_name: rag-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - rag-network
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  ollama-data:
    driver: local
  ollama-webui-data:
    driver: local
  chroma-data:
    driver: local
  qdrant-data:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  node_modules:
    driver: local

networks:
  rag-network:
    driver: bridge
